<title>SDP Print Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Tata letak: bar atas gelap + pemilih peran, tab menu sesuai peran, konten satu kolom dengan kartu seperlunya.
   Warna berasal dari tinta cetak: navy (dasar), magenta = DTF, teal = Sublim, kuning = perhatian. */
:root{--bg:#f4f5f8;--panel:#fff;--ink:#17203a;--muted:#5a637a;--line:#dde1ea;--navy:#14213d;--on-navy:#fff;
--dtf:#b3175c;--dtf-soft:#fbe7f0;--sub:#006d80;--sub-soft:#e0f2f5;--yellow:#f2b705;--on-yellow:#241b00;
--ok:#1c7a46;--ok-soft:#e3f3e9;--warn:#8a5a00;--warn-soft:#fdf0cc;--bad:#b3261e;--bad-soft:#fbe5e3;
--fd:'Archivo',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1422;--panel:#171e30;--ink:#e8ebf4;--muted:#9ca6bd;--line:#2a3450;--navy:#070b16;--on-navy:#fff;--dtf:#ff7ab0;--dtf-soft:#3a1528;--sub:#5fd0e0;--sub-soft:#0d333b;--yellow:#f2b705;--on-yellow:#241b00;--ok:#6fd59a;--ok-soft:#123222;--warn:#f0c25a;--warn-soft:#372a0a;--bad:#ff8f86;--bad-soft:#3d1815;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1422;--panel:#171e30;--ink:#e8ebf4;--muted:#9ca6bd;--line:#2a3450;--navy:#070b16;--on-navy:#fff;--dtf:#ff7ab0;--dtf-soft:#3a1528;--sub:#5fd0e0;--sub-soft:#0d333b;--yellow:#f2b705;--on-yellow:#241b00;--ok:#6fd59a;--ok-soft:#123222;--warn:#f0c25a;--warn-soft:#372a0a;--bad:#ff8f86;--bad-soft:#3d1815;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--fb)}
.in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);align-items:start}
.side{background:var(--navy);color:var(--on-navy);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;padding:16px 12px 16px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.logo{font:800 19px var(--fd);display:flex;align-items:center;gap:10px;padding:0 6px}
.cmyk{display:inline-flex;height:18px}.cmyk i{width:6px;display:block}
.who{font-size:12.5px;display:flex;flex-direction:column;gap:6px;padding:0 6px;align-items:flex-start}.who b{font-size:13.5px}
.who a,.who button{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow)}
.login{max-width:380px}.login .f{grid-template-columns:1fr}
.side nav{display:flex;flex-direction:column;gap:2px}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.55;padding:12px 10px 4px}
.side nav a{padding:9px 10px;border-radius:7px;white-space:nowrap;text-decoration:none;color:var(--on-navy);opacity:.82;font-weight:600}
.side nav a:hover{opacity:1;background:rgba(255,255,255,.08)}
.side nav a[aria-current]{opacity:1;background:rgba(255,255,255,.14);box-shadow:inset 3px 0 0 var(--yellow)}
.body{min-width:0}
.sim{background:var(--yellow);color:var(--on-yellow);font-size:12.5px;font-weight:600}
.sim .in{padding-block:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
main.in{padding-block:20px 48px}
@media (max-width:760px){
.shell{grid-template-columns:minmax(0,1fr)}
.side{position:static;height:auto;overflow:visible;gap:10px;padding-right:max(12px,env(safe-area-inset-right,0px))}
.side nav{flex-direction:row;overflow-x:auto;padding-bottom:2px}
.grp{display:none}
.side nav a[aria-current]{box-shadow:inset 0 -3px 0 var(--yellow)}
}
h1{font:800 26px/1.2 var(--fd);margin:0 0 4px;text-wrap:balance}h2{font:800 17px var(--fd);margin:0 0 10px}h3{font:600 14px var(--fb);margin:0 0 6px}
p{margin:0 0 10px;max-width:70ch}.muted{color:var(--muted)}.small{font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:14px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.grid>.card{margin-top:0}.mt{margin-top:14px}
.door{border-top:5px solid var(--dtf);display:flex;flex-direction:column;gap:6px;align-items:flex-start}.door.b2b{border-top-color:var(--sub)}
button,.btn{font:600 13px var(--fb);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:8px 13px;cursor:pointer;text-decoration:none;display:inline-block}
button.pri,.btn.pri{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
button.d{background:var(--dtf-soft);color:var(--dtf);border-color:var(--dtf)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:1px}
input,select,textarea{font:400 14px var(--fb);width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)}
input[type=checkbox]{width:auto}
.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.f label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row input,.row select{width:auto;max-width:100%}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tag{display:inline-block;border-radius:99px;padding:1px 9px;font-size:11.5px;font-weight:600;background:var(--line);white-space:nowrap}
.tag.dtf{background:var(--dtf-soft);color:var(--dtf)}.tag.sub{background:var(--sub-soft);color:var(--sub)}.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}
.kpi{font:800 28px var(--fd);font-variant-numeric:tabular-nums}
.total{font:800 22px var(--fd)}
.steps{display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:10px 0;list-style:none}.steps li{padding:5px 10px;border-radius:99px;background:var(--line);font-size:12px;font-weight:600}.steps li.on{background:var(--navy);color:var(--on-navy)}.steps li.done{background:var(--ok-soft);color:var(--ok)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--on-navy);padding:10px 16px;border-radius:8px;max-width:92vw;z-index:20;font-weight:600}
details{padding:9px 0;border-bottom:1px solid var(--line)}summary{cursor:pointer;font-weight:600}details p{margin:6px 0 0}
</style>

<script>
'use strict';
const KEY='sdp-sim-v7';
const ROLES={master:'Admin Sistem',manager:'Manager',spv:'SPV SDP',cs:'CS (DTF + Sublim)',crm:'CRM',store:'Store Head',op:'Operator Produksi',qc:'QC',gudang:'Gudang',fat:'FAT / Finance'};
const PAGES={masuk:'Masuk',dashboard:'Dashboard',input:'Input Order',cs:'Meja CS',cekfile:'Cek File',toko:'Order Toko Saya',produksi:'Antrian Produksi',qc:'QC',serah:'Serah Terima',bayar:'Pembayaran',
pelanggan:'Pelanggan B2B',stok:'SKU & Inventory',loss:'Loss Sales & Log QC',laporan:'Laporan',layanan:'Layanan & Harga',lacak:'Lacak Order',atur:'Pengaturan',pengguna:'Pengguna',akses:'Hak Akses',akun:'Akun Saya'};
const GROUPS=[['Ringkasan',['dashboard','laporan']],['Order',['input','cs','toko','pelanggan','lacak']],['Produksi',['cekfile','produksi','qc','serah']],['Keuangan dan data',['bayar','stok','loss']],['Referensi',['layanan']],['Admin',['atur','pengguna','akses']],['Akun',['masuk','akun']]];
// Hak akses bawaan. Admin Sistem selalu memegang semua menu; peran lain dapat diatur di menu Hak Akses.
const ACCESS_DEFAULT={public:['layanan','lacak'],
manager:['dashboard','laporan','pelanggan','produksi','bayar','stok','loss','layanan','lacak'],
spv:['dashboard','laporan','cs','cekfile','produksi','qc','serah','stok','loss','layanan','lacak'],
cs:['dashboard','input','cs','pelanggan','bayar','produksi','serah','loss','layanan','lacak'],
crm:['pelanggan','layanan','lacak'],
store:['input','toko','layanan','lacak'],
op:['cekfile','produksi','qc','stok'],qc:['qc','produksi'],gudang:['stok','serah'],
fat:['bayar','laporan','layanan','lacak']};
const STAFF_ROLES=Object.keys(ROLES).filter(r=>r!=='master');
const GRANTABLE=['dashboard','laporan','input','cs','toko','pelanggan','cekfile','produksi','qc','serah','bayar','stok','loss','layanan','lacak'];
const DEMO_PASS='demo123',STORE='Tigalapan Kaos (contoh toko)';
const demoUsers=()=>[['MASTER01','Contoh Admin','master'],['MGR01','Contoh Manager','manager'],['SPV01','Contoh SPV','spv'],['CS01','Contoh CS','cs'],['CRM01','Contoh CRM','crm'],['STH01','Contoh Store Head','store'],['OPR01','Contoh Operator','op'],['QC01','Contoh QC','qc'],['GDG01','Contoh Gudang','gudang'],['FAT01','Contoh FAT','fat']].map(([code,name,role])=>({code,name,role,active:true,hash:null}));
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
const passOk=async(u,p)=>u.hash?u.hash===await sha(u.code+'|'+p):p===DEMO_PASS;

// Price list retail dan norma DTF disalin dari aplikasi DTF Manage Pro (price list 04 Nov 2026). Harga sublim di bawah hanya contoh.
const RETAIL={'DTF Logo':{s:'10 x 15 cm',w:15,l:10,p:[6000,5500,4500]},'DTF A':{s:'A5, 15 x 21 cm',w:21,l:15,p:[10000,9000,7000]},'DTF B':{s:'A4, 21 x 30 cm',w:30,l:21,p:[17000,16000,12000]},'DTF C':{s:'A3, 30 x 42 cm',w:42,l:30,p:[25000,23000,18000]},'DTF D':{s:'A2, 42 x 59 cm',w:59,l:42,p:[45000,41000,32000]}};
const WIDTHS=[['priceSub120','Lebar kain sampai 120 cm'],['priceSub160','Lebar kain 121 sampai 160 cm'],['priceSub180','Lebar kain 161 sampai 180 cm']];
const CANVAS=58;
const MACHINES={dtf:{n:'Printer DTF Rhinotec',svc:'dtf',norm:'normDtf'},subp:{n:'Printer Sublim (pengadaan)',svc:'sub',norm:'normSubPrint'},cal:{n:'Mesin Press / Calender (pengadaan)',svc:'sub',norm:'normPress'}};
const STATUS={cek:['Cek file oleh Operator','warn'],revisi:['Menunggu revisi file','bad'],bayar:['Menunggu pelunasan','warn'],antrian:['Antrian cetak',''],produksi:['Sedang cetak / press',''],curing:['Powder dan curing',''],qc:['Menunggu QC','warn'],packing:['Dikemas dan dilabeli','warn'],siap:['Siap kirim','ok'],selesai:['Selesai','ok'],ditolak:['Ditolak','bad']};
const money=n=>n==null?'Belum diatur':'Rp '+Math.round(n).toLocaleString('id-ID');
const num=n=>Number(n).toLocaleString('id-ID',{maximumFractionDigits:2});
const dt=t=>t?new Date(t).toLocaleString('id-ID',{timeZone:'Asia/Makassar',weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' WITA':'Belum diatur';
const today=()=>new Date(Date.now()+288e5).toISOString().slice(0,10);
const r2=n=>Math.round(n*100)/100;

function tier(q){return q<=11?0:q<=36?1:2;}
// Panjang film terpakai: pilih orientasi yang paling hemat pada lebar cetak 58 cm.
function filmCm(d,q){let best=Infinity;for(const[a,b]of[[d.w,d.l],[d.l,d.w]]){const per=Math.floor(CANVAS/a);if(per>0)best=Math.min(best,Math.ceil(q/per)*b);}return best;}
function retailItems(q){return Object.entries(q).filter(([,n])=>n>0).map(([k,n])=>({name:k,qty:n,unit:'pcs',price:RETAIL[k].p[tier(n)],meter:filmCm(RETAIL[k],n)/100}));}
const meterItem=(name,meter,price)=>({name,qty:meter,unit:'meter',price,meter});

function demoCustomers(){const c=(code,name,n,source,status)=>({code,name,wa:'08xx-xxxx-000'+n,source,status});
 return[c('TK-0001','Contoh Konveksi Anging',1,'Tigalapan Kaos','aktif'),c('TK-0002','Contoh Jersey Maros',3,'Tigalapan Kaos','aktif'),c('TK-0003','Contoh Sablon Pettarani',4,'Tigalapan Kaos','aktif'),c('BR-0001','Contoh Brand Baru',6,'Customer baru','menunggu')];}
function seed(){
 const now=Date.now(),sku=(code,name,svc,unit,stock,min,use,machine)=>({code,name,svc,unit,stock,min,use,machine});
 const s={settings:{priceDtf:23000,priceSub120:20000,priceSub160:26000,priceSub180:30000,normDtf:240,normSubPrint:null,normPress:null},seq:6,customers:demoCustomers(),qcReports:[],session:null,users:demoUsers(),access:JSON.parse(JSON.stringify(ACCESS_DEFAULT)),loss:[],ledger:[],
 skus:[sku('SDP-DTF-FLM-60','PET Film DTF 60 cm','dtf','meter',180,100,1.05,'dtf'),sku('SDP-DTF-INK-WH','Tinta DTF White','dtf','ml',2400,1000,8,'dtf'),sku('SDP-DTF-INK-CY','Tinta DTF Cyan','dtf','ml',900,500,2,'dtf'),sku('SDP-DTF-INK-MG','Tinta DTF Magenta','dtf','ml',850,500,2,'dtf'),sku('SDP-DTF-INK-YL','Tinta DTF Yellow','dtf','ml',420,500,2,'dtf'),sku('SDP-DTF-INK-BK','Tinta DTF Black','dtf','ml',1100,500,2,'dtf'),sku('SDP-DTF-PWD-01','Powder Hot Melt','dtf','gram',6500,3000,15,'dtf'),sku('SDP-DTF-CLN-01','Cairan Cleaning DTF','dtf','ml',1500,500,0,'dtf'),
 sku('SDP-SUB-PPR-01','Kertas Sublim Roll','sub','meter',300,150,1.05,'subp'),sku('SDP-SUB-INK-CY','Tinta Sublim Cyan','sub','ml',2000,800,3,'subp'),sku('SDP-SUB-INK-MG','Tinta Sublim Magenta','sub','ml',2000,800,3,'subp'),sku('SDP-SUB-INK-YL','Tinta Sublim Yellow','sub','ml',2000,800,3,'subp'),sku('SDP-SUB-INK-BK','Tinta Sublim Black','sub','ml',2000,800,3,'subp'),sku('SDP-SUB-TSU-01','Kertas Pelindung Press','sub','meter',250,100,1.05,'cal')],
 orders:[]};
 const o=(n,type,service,customer,source,items,status,extra={})=>({id:'SDP-261126-'+String(n).padStart(3,'0'),type,service,customer,wa:'08xx-xxxx-000'+n,source,store:source==='Toko'?STORE:'-',items,status,created:now-(6-n)*36e5,createdBy:source==='Toko'?'STH01':'CS01',file:'file-siap-cetak-'+n+'.pdf',track:'CTH'+n+'-7K2Q9'+n,stage:service==='dtf'?'dtf':'subp',pay:[],...extra});
 const pay=amount=>({amount,method:'Transfer',by:'CS01',at:now});
 s.orders=[o(1,'maklon','dtf','Contoh Konveksi Anging','WhatsApp',[meterItem('DTF maklon per meter',12,23000)],'antrian',{approved:now,custCode:'TK-0001',pay:[pay(276000)]}),
 o(2,'retail','dtf','Contoh Customer Rani','Toko',retailItems({'DTF B':14,'DTF Logo':6}),'cek'),
 o(3,'maklon','sub','Contoh Jersey Maros','WhatsApp',[meterItem('Sublim print + press, lebar sampai 160 cm',30,26000)],'revisi',{custCode:'TK-0002',issue:'Resolusi di bawah 300 DPI'}),
 o(4,'maklon','dtf','Contoh Sablon Pettarani','WhatsApp',[meterItem('DTF maklon per meter',5,23000)],'siap',{custCode:'TK-0003',pay:[pay(115000)]}),
 o(5,'retail','dtf','Contoh Customer Dedi','Datang langsung',retailItems({'DTF C':3}),'cek'),
 o(6,'maklon','dtf','Contoh Konveksi Anging','WhatsApp',[meterItem('DTF maklon per meter',8,23000)],'bayar',{custCode:'TK-0001',pay:[pay(100000)]})];
 return s;
}
let S;try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){S=null;}
if(!S||!S.skus)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const me=()=>S.users.find(u=>u.code===S.session&&u.active)||null;
const role=()=>me()?me().role:'public';
const is=(...r)=>role()==='master'||r.includes(role());
function allowed(){const r=role();if(r==='master')return Object.keys(PAGES).filter(k=>k!=='masuk');return[...(S.access[r]||[]),r==='public'?'masuk':'akun'];}
const HOME={public:'masuk',master:'dashboard',manager:'dashboard',spv:'dashboard',cs:'cs',crm:'pelanggan',store:'toko',op:'cekfile',qc:'qc',gudang:'stok',fat:'bayar'};
const home=()=>{const h0=HOME[role()],ok=allowed();return ok.includes(h0)?h0:ok[0];};
function goto(p){if(location.hash.slice(1)===p)render();else location.hash=p;}
const meterOf=o=>o.reworkM||o.items.reduce((a,i)=>a+i.meter,0);
const totalOf=o=>o.items.some(i=>i.price==null)?null:o.items.reduce((a,i)=>a+i.price*i.qty,0);
const paidOf=o=>o.pay.reduce((a,p)=>a+p.amount,0);
function payState(o){const t=totalOf(o),v=paidOf(o);if(t!=null&&v>=t)return['Lunas','ok'];if(v>0)return['DP / sebagian','warn'];return['Belum bayar','bad'];}
const svcTag=s=>h('span',{class:'tag '+s},s==='dtf'?'DTF':'Sublim');
const typeTag=t=>h('span',{class:'tag'},t==='retail'?'Retail':'B2B Maklon');
const stTag=o=>h('span',{class:'tag '+STATUS[o.status][1]},STATUS[o.status][0]+(o.status==='antrian'&&o.stage==='cal'?' (press)':''));
const payTag=o=>{const[t,c]=payState(o);return h('span',{class:'tag '+c},t);};
const itemsText=o=>o.items.map(i=>i.name+' '+num(i.qty)+' '+i.unit).join(', ');

function h(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k!=='value')e.setAttribute(k,v===true?'':v);}
 for(const c of kids.flat(Infinity))if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(String(c)));if(attrs&&attrs.value!=null)e.value=attrs.value;return e;}
const card=(...k)=>h('div',{class:'card'},...k);
const lab=(t,el)=>h('label',{},t,el);
const table=(cols,rows,empty='Belum ada data')=>h('div',{class:'tw'},h('table',{},h('thead',{},h('tr',{},cols.map(c=>h('th',{},c[0])))),h('tbody',{},rows.length?rows.map(r=>h('tr',{},cols.map(c=>h('td',{},c[1](r))))):h('tr',{},h('td',{colspan:cols.length,class:'muted'},empty)))));
let timer;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(timer);timer=setTimeout(()=>e.hidden=true,4200);}
function done(msg){save();render();if(msg)toast(msg);}
const copy=(text,ok)=>navigator.clipboard.writeText(text).then(()=>toast(ok),()=>toast(text));
const waText=o=>'Halo '+o.customer+', order '+o.id+': '+itemsText(o)+'. Total '+money(totalOf(o))+'. Balas SETUJU dan lunasi pembayaran agar order masuk antrian produksi. Cek status dengan resi '+o.track+'.';
const isPaid=o=>payState(o)[0]==='Lunas';
const custOf=o=>S.customers.find(c=>c.code===o.custCode);
const custOk=o=>!o.custCode||custOf(o)?.status==='aktif';
// Alur WIC-OPR-005: Operator menyatakan file layak, lalu order wajib lunas (dicatat CS / Store Head) sebelum masuk antrian.
function release(o){if(o.status==='bayar'&&isPaid(o)){o.status='antrian';o.approved=Date.now();return true;}return false;}
function fileOk(o){o.status='bayar';return release(o);}
const billText=o=>'Halo '+o.customer+', file order '+o.id+' sudah layak cetak. Total '+money(totalOf(o))+', sisa '+money(totalOf(o)-paidOf(o))+'. Produksi dimulai setelah lunas. Cek status dengan resi '+o.track+'.';
const busy=o=>o.status==='produksi'||o.status==='curing';

// Kalender produksi: 09.00-12.00 dan 13.00-16.00 WITA, Minggu libur.
function addWork(start,sec){const M=60000,D=864e5,off=480*M;let left=sec*1000,day=Math.floor((start+off)/D),min=((start+off)-day*D)/M;
