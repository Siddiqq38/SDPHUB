<text x="160" y="599" text-anchor="middle" font-size="12" fill="#14518f">DTF: film, powder, curing</text>
<rect x="325" y="569" width="250" height="52" rx="10" fill="#e6f1fc" stroke="#9cc3ea"/>
<text x="450" y="599" text-anchor="middle" font-size="12" fill="#14518f">Sublim: print kertas</text>
