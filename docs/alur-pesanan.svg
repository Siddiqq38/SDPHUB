<text x="740" y="592" text-anchor="middle" font-size="12" fill="#14518f">Sublim kain: print dan</text>
<text x="740" y="606" text-anchor="middle" font-size="12" fill="#14518f">transfer calender</text>
<rect x="325" y="669" width="250" height="52" rx="10" fill="#e6f1fc" stroke="#9cc3ea"/>
<text x="450" y="692" text-anchor="middle" font-size="12" fill="#14518f">QC hasil: Pass / Hold / Rework</text>
<text x="450" y="706" text-anchor="middle" font-size="12" fill="#14518f">/ Reject</text>
<rect x="325" y="754" width="250" height="52" rx="10" fill="#e6f1fc" stroke="#9cc3ea"/>
<text x="450" y="777" text-anchor="middle" font-size="12" fill="#14518f">Packing dan serah terima</text>
<text x="450" y="791" text-anchor="middle" font-size="12" fill="#14518f">sebagian atau penuh</text>
<rect x="325" y="839" width="250" height="52" rx="10" fill="#e6f1fc" stroke="#9cc3ea"/>
<text x="450" y="862" text-anchor="middle" font-size="12" fill="#14518f">Tracking customer dan</text>
<text x="450" y="876" text-anchor="middle" font-size="12" fill="#14518f">penutupan</text>
<text x="20" y="915" font-size="11" fill="#5b6577">Aturan: CS tidak merilis sendiri. Satu mesin satu WO pada satu waktu. Hasil kain dan kertas Sublim tidak dihitung ganda. Serah terima boleh sebagian.</text>
